# Áp dụng tay một lần (repo infra không tự triển khai chính nó):
#   ssh philand-01 'sudo k3s kubectl apply -f phimond.yaml'
# Repo public nên ArgoCD không cần repo credential.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phimond
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/fissama/phimond-infra.git
    targetRevision: main
    path: deploy/phimond
  destination:
    server: https://kubernetes.default.svc
    namespace: phimond
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
